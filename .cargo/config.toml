[env]
# Fix bindgen parsing against latest MSVC STL headers on Windows.
# Without this, `lightgbm3-sys` can fail with:
# "error STL1000: Unexpected compiler version..."
BINDGEN_EXTRA_CLANG_ARGS = "-D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH"
# NOTE: do NOT enable +crt-static here — lightgbm3-sys' prebuilt C++
# objects are compiled against the dynamic CRT and the linker fails
# with unresolved __imp_fsetpos / __imp_fseeki64 / __imp_ungetc / etc.
# The runtime UCRT DLLs (api-ms-win-crt-*.dll) ship with VS C++
# Redistributable; if missing, copy them alongside neoethos-cli.exe.

[build]
# Cargo accepts negative job counts as `effective logical CPUs + jobs`.
# One physical core / two SMT threads remain free on every host while Cargo's
# inherited jobserver stays the sole compile-wide parallelism authority.
jobs = -2

# Repository-wide builds stay on Rust's portable platform baseline. Optimized
# x86-64 v3 payloads are built only by the versioned launcher/package boundary,
# in a separate target directory with an explicit compiler flag. This keeps
# tests, examples, sidecars, installers, and developer commands executable on
# hosts that cannot pass the launcher preflight.
