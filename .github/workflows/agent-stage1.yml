name: Agent Stage 1 patch and test

on:
  pull_request:
    branches: [master]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: agent-stage1-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-and-test:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install repository system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mold lld clang pkg-config

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-04-07
          components: rustfmt

      - name: Apply queued agent migrations
        id: patches
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          applied=false

          scripts=(.github/agent-patches/*.py)
          for script in "${scripts[@]}"; do
            echo "Running deterministic migration $script"
            python3 "$script"
            rm "$script"
            applied=true
          done

          patches=(.github/agent-patches/*.patch)
          for patch in "${patches[@]}"; do
            echo "Applying $patch"
            git apply --3way "$patch"
            rm "$patch"
            applied=true
          done

          echo "applied=$applied" >> "$GITHUB_OUTPUT"

      - name: Check changed Rust formatting
        shell: bash
        run: |
          set -o pipefail
          mkdir -p /tmp/stage1-diagnostics
          mapfile -d '' rust_files < <(git diff --name-only -z origin/master...HEAD -- '*.rs')
          if (( ${#rust_files[@]} == 0 )); then
            echo "No changed Rust files" | tee /tmp/stage1-diagnostics/format.log
          else
            printf 'Checking %s\n' "${rust_files[@]}" | tee /tmp/stage1-diagnostics/format.log
            rustfmt --edition 2024 --check "${rust_files[@]}" 2>&1 | tee -a /tmp/stage1-diagnostics/format.log
          fi

      - name: Test search crate
        shell: bash
        run: |
          set -o pipefail
          cargo test -p neoethos-search 2>&1 | tee /tmp/stage1-diagnostics/test.log

      - name: Check search GPU feature
        shell: bash
        run: |
          set -o pipefail
          cargo check -p neoethos-search --features gpu-vulkan 2>&1 | tee /tmp/stage1-diagnostics/gpu-check.log

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stage1-diagnostics-${{ github.run_id }}
          path: /tmp/stage1-diagnostics
          if-no-files-found: error
          retention-days: 3

      - name: Commit verified migration results
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo "No verified changes to commit"
            exit 0
          fi
          message="chore(agent): apply verified Stage 1 migration"
          if [[ -f .github/agent-patches/commit-message.txt ]]; then
            message="$(cat .github/agent-patches/commit-message.txt)"
            rm .github/agent-patches/commit-message.txt
          fi
          git config user.name "neoethos-stage1-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "$message"
          git push origin "HEAD:${{ github.head_ref }}"
