name: Agent Stage 1 patch and test

on:
  push:
    branches: [agent/gpu-native-stage1]
  pull_request:
    branches: [master]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: agent-stage1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-and-test:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Resolve branch name
        id: branch
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "name=${{ github.head_ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.branch.outputs.name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply queued agent migrations
        id: patches
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          applied=false

          scripts=(.github/agent-patches/*.py)
          for script in "${scripts[@]}"; do
            echo "Running deterministic migration $script"
            python3 "$script"
            rm "$script"
            applied=true
          done

          patches=(.github/agent-patches/*.patch)
          for patch in "${patches[@]}"; do
            echo "Applying $patch"
            git apply --3way "$patch"
            rm "$patch"
            applied=true
          done

          echo "applied=$applied" >> "$GITHUB_OUTPUT"

      - name: Format workspace
        run: cargo fmt --all

      - name: Test search crate
        run: cargo test -p neoethos-search

      - name: Check search GPU feature
        run: cargo check -p neoethos-search --features gpu-vulkan

      - name: Commit verified migration results
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo "No verified changes to commit"
            exit 0
          fi
          message="chore(agent): apply verified Stage 1 migration"
          if [[ -f .github/agent-patches/commit-message.txt ]]; then
            message="$(cat .github/agent-patches/commit-message.txt)"
            rm .github/agent-patches/commit-message.txt
          fi
          git config user.name "neoethos-stage1-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "$message"
          git push origin "HEAD:${{ steps.branch.outputs.name }}"
