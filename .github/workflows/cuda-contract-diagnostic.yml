name: Temporary CUDA replacement contract diagnostic
on:
  push:
    branches: [codex/cuda-workspace-contract-20261005]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-04-07
          components: rustfmt
      - name: Format and compile replacement contracts
        run: |
          set -euo pipefail
          mkdir -p /tmp/cuda-contract-results /tmp/portable-baseline/tests
          contract=crates/neoethos-gpu-cuda/tests/portable_native_intrinsics_contract.rs
          rustfmt --edition 2024 --config skip_children=true "$contract"
          cp "$contract" /tmp/cuda-contract-results/
          rustc --edition 2024 --test "$contract" -D warnings -o /tmp/updated-contract
          git show ecc236ddb1e82baaf3a1c9744cf4ca8a4ee1fa36:"$contract" > /tmp/portable-baseline/tests/original.rs
          ln -s "$PWD/crates/neoethos-gpu-cuda/native" /tmp/portable-baseline/native
          rustc --edition 2024 --test /tmp/portable-baseline/tests/original.rs -D warnings -o /tmp/original-contract
      - name: Verify baseline and repaired contracts including source mutations
        run: |
          python3 - <<'PY'
          import pathlib
          import subprocess
          output = pathlib.Path('/tmp/cuda-contract-results')
          for binary, expected_code, expected_count in [
              ('original', 101, '11 passed; 1 failed'),
              ('updated', 0, '12 passed; 0 failed'),
          ]:
              result = subprocess.run([f'/tmp/{binary}-contract'], text=True, capture_output=True)
              (output / f'{binary}.log').write_text(result.stdout + result.stderr)
              print(result.stdout, flush=True)
              assert result.returncode == expected_code and expected_count in result.stdout
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cuda-contract-results-${{ github.run_id }}
          path: /tmp/cuda-contract-results
          if-no-files-found: error
          retention-days: 3
