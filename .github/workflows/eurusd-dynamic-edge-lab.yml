name: EURUSD dynamic-lot multi-family pre-OOS edge lab

on:
  push:
    branches:
      - exp/pre-oos-funnel-ci-20261025
    paths:
      - ".github/workflows/eurusd-dynamic-edge-lab.yml"
      - "scripts/eurusd_dynamic_edge_lab.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dynamic-sizing-research:
    name: Selection-only EURUSD Risky and PropFirm proxy research
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install reproducible public numerical engine
        run: python -m pip install 'vortex-data==0.88.0' 'numpy==2.2.6' 'pandas==2.3.3' 'numba==0.61.2'
      - name: Download checksum-pinned real EURUSD data
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 20 \
            -o EURUSD.tar \
            https://github.com/kosred/neoethos-data/releases/download/snapshot-2026-08-09/EURUSD.tar
          echo '042aa66fde29e697bd30d93d85c4762076c06e292097e42680ed0067b06ca061  EURUSD.tar' | sha256sum -c -
      - name: Explore distinct strategies with dynamic lots and internal validation only
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/eurusd_dynamic_edge_lab.py
          python scripts/eurusd_dynamic_edge_lab.py \
            --archive EURUSD.tar --out eurusd-edge-lab-results \
            | tee eurusd-edge-lab-console.log
          test -s eurusd-edge-lab-results/results.json
          test -s eurusd-edge-lab-results/report.md
          cat eurusd-edge-lab-results/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve both evidence and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eurusd-dynamic-edge-lab-results
          path: |
            eurusd-edge-lab-results/
            eurusd-edge-lab-console.log
          if-no-files-found: warn
          retention-days: 30
