name: Release (GPU)

# Builds the GPU-enabled release for Windows + Linux as a single artifact
# per platform. End-users need only an NVIDIA driver; the CUDA runtime
# libraries the binary loads are bundled inside the installer/tarball.
#
# 2026-08-02: libtorch is no longer downloaded or bundled. Nothing in a
# shipped build links it — `tch` is optional in neoethos-models and enabled
# by no feature, and d4df966a dropped the `dep:tch` that neoethos-search
# once had. What the ~2 GB libtorch bundle was actually delivering was the
# CUDA REDISTRIBUTABLES that happen to sit in its lib/ directory, and those
# are still required: cudarc dlopens nvrtc + cudart for CubeCL's JIT,
# neoethos-gpu-cuda links cudart, and candle needs cublas/curand. They now
# come from the CUDA toolkit this workflow already installs, which is both
# the honest source and a far smaller bundle.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.1.0-alpha)'
        required: false
        default: 'v0.1.0-alpha'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  BINDGEN_EXTRA_CLANG_ARGS: "-D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH"

  # CUDA toolkit version installed on the build runner via Jimver/cuda-toolkit.
  # This is now the single CUDA version in the workflow: it supplies nvcc for
  # the .cu compiles AND the redistributable runtime libraries that get
  # bundled. Minor-version compatibility means a 13.x runtime works against
  # any 13.x driver.
  CUDA_TOOLKIT_VERSION: "13.2.0"

  # Cargo features enabled in the release. Keep in sync with the
  # neoethos-app Cargo.toml `gpu` feature definition.
  RELEASE_FEATURES: "gpu"

  # candle-kernels (RL models via rlkit) compiles its CUDA kernels through
  # bindgen_cuda, which probes `nvidia-smi` for the compute capability —
  # CI runners have no GPU, so the probe panics unless this is set.
  # 80 = Ampere baseline: bf16 kernels compile natively and the PTX
  # forward-JITs onto 8.6/8.9/9.0/12.0 cards. Turing (sm_75) users still
  # get the Vulkan path; only candle RL kernels need 8.0+.
  CUDA_COMPUTE_CAP: "80"

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Windows GPU release — NSIS installer + portable zip
  # ────────────────────────────────────────────────────────────────────────────
  build-windows:
    name: Windows (x86_64-msvc, GPU)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Rust toolchain (stable MSVC)
        uses: dtolnay/rust-toolchain@nightly
        with:
          # Pin the repo nightly — dtolnay's RUSTUP_TOOLCHAIN overrides the file.
          toolchain: nightly-2026-04-07-x86_64-pc-windows-msvc

      - name: Cache Cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: windows-cargo-gpu-cuda${{ env.CUDA_TOOLKIT_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            windows-cargo-gpu-cuda${{ env.CUDA_TOOLKIT_VERSION }}-
            windows-cargo-gpu-

      # candle-kernels compiles .cu → PTX via nvcc, and nvcc on Windows
      # requires cl.exe (the MSVC host compiler) on PATH. GitHub runners
      # only expose cl.exe inside a VS dev shell — without this step nvcc
      # dies with an EMPTY stdout/stderr (round-6 failure signature).
      - name: MSVC dev environment (cl.exe on PATH for nvcc)
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install CUDA toolkit (Windows)
        uses: Jimver/cuda-toolkit@v0.2.35
        id: cuda-toolkit
        with:
          cuda: ${{ env.CUDA_TOOLKIT_VERSION }}
          method: 'network'
          # `nvrtc` added 2026-08-02: cudarc dlopens nvrtc at runtime to JIT
          # CubeCL kernels. It used to arrive by accident inside the libtorch
          # bundle; with libtorch gone it has to be asked for.
          sub-packages: '["nvcc", "cudart", "nvrtc", "thrust", "cublas", "cusparse", "cusolver", "curand"]'

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked --version "^0.11"

      - name: Build release binary (GPU)
        shell: pwsh
        run: |
          cargo build -p neoethos-app --release --no-default-features --features "${env:RELEASE_FEATURES}"

      - name: Stage native runtime DLLs
        # Stages every native runtime dependency next to the binary so the
        # NSIS packager and the portable zip both pick them up:
        #  - xgboost.dll / catboostmodel.dll: tree-model native bindings
        #  - CUDA redistributables: cudart (neoethos-gpu-cuda links it, and
        #    cudarc loads it), nvrtc + its builtins (CubeCL JIT), cublas /
        #    cublasLt / curand (candle), cusparse / cusolver / nvJitLink
        #    (pulled in by cublasLt on 13.x). Explicitly named rather than
        #    globbed: a glob of the toolkit bin/ would also drag in nvcc,
        #    cuobjdump and the rest of the developer tooling.
        shell: pwsh
        run: |
          $release = "target\release"
          # Tree-model bindings
          Copy-Item "$release\deps\xgboost.dll" "$release\xgboost.dll" -Force -ErrorAction SilentlyContinue
          if (Test-Path "$release\catboostmodel.dll") {
              Copy-Item "$release\catboostmodel.dll" "crates\neoethos-app\catboostmodel.dll" -Force
          }
          if (Test-Path "$release\xgboost.dll") {
              Copy-Item "$release\xgboost.dll" "crates\neoethos-app\xgboost.dll" -Force
          }
          # CUDA runtime redistributables from the toolkit installed above.
          $cudaBin = Join-Path $env:CUDA_PATH "bin"
          if (-not (Test-Path $cudaBin)) {
              throw "CUDA_PATH\bin not found ($cudaBin); the toolkit step did not export CUDA_PATH."
          }
          $patterns = @(
              "cudart64_*.dll",
              "nvrtc64_*.dll", "nvrtc-builtins64_*.dll",
              "cublas64_*.dll", "cublasLt64_*.dll",
              "curand64_*.dll",
              "cusparse64_*.dll", "cusolver64_*.dll",
              "nvJitLink_*.dll"
          )
          $staged = @()
          foreach ($pattern in $patterns) {
              $staged += Get-ChildItem -Path $cudaBin -Filter $pattern -ErrorAction SilentlyContinue
          }
          if ($staged.Count -eq 0) {
              throw "No CUDA runtime DLLs matched under $cudaBin — the bundle would ship without a CUDA runtime."
          }
          foreach ($dll in $staged) {
              Write-Host "staging $($dll.Name)"
              Copy-Item $dll.FullName "$release\"              -Force
              Copy-Item $dll.FullName "crates\neoethos-app\"   -Force
          }

      - name: Update packager resources to include the CUDA runtime
        shell: pwsh
        run: |
          $cargoToml = "crates\neoethos-app\Cargo.toml"
          $content = Get-Content $cargoToml -Raw
          # Bundle whatever the staging step actually placed in the crate root.
          $cudaDlls = (Get-ChildItem "crates\neoethos-app\*.dll" |
              Where-Object { $_.Name -notin @("catboostmodel.dll", "xgboost.dll") } |
              ForEach-Object { "`"$($_.Name)`"" }) -join ", "
          $newResources = "resources = [`"config.yaml`", `"catboostmodel.dll`", `"xgboost.dll`", $cudaDlls]"
          $content = [regex]::Replace($content, 'resources = \[[^\]]*\]', $newResources)
          Set-Content $cargoToml $content -NoNewline

      - name: Package NSIS installer
        run: cargo packager --release -p neoethos-app --formats nsis
        env:
          NSIS_PLUGINS: "${{ runner.tool_cache }}\\nsis"

      - name: Cleanup staged DLLs from crate root
        shell: pwsh
        run: |
          Remove-Item "crates\neoethos-app\catboostmodel.dll" -ErrorAction SilentlyContinue
          Remove-Item "crates\neoethos-app\xgboost.dll"       -ErrorAction SilentlyContinue
          Remove-Item "crates\neoethos-app\*.dll"             -ErrorAction SilentlyContinue
          # Restore unmodified Cargo.toml so the cache key stays stable
          git checkout -- "crates\neoethos-app\Cargo.toml"

      - name: Create portable zip
        shell: pwsh
        run: |
          $version = "${{ github.ref_name || inputs.version }}"
          $outDir = "dist\NeoEthos-windows-x64-gpu"
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null
          Copy-Item "target\release\neoethos-app.exe" "$outDir\NeoEthos.exe"
          Copy-Item "target\release\catboostmodel.dll" "$outDir\catboostmodel.dll" -ErrorAction SilentlyContinue
          Copy-Item "target\release\xgboost.dll"       "$outDir\xgboost.dll"       -ErrorAction SilentlyContinue
          Copy-Item "target\release\*.dll"             "$outDir\" -Force
          Copy-Item "config.yaml"                      "$outDir\config.yaml"
          # Drop a README so end users know what's bundled
          @"
          NeoEthos $version (Windows, GPU)
          ================================

          Runtime requirements:
            - NVIDIA driver supporting CUDA 13.0 or newer (CUDA 13.2 recommended)
              -> verify with: nvidia-smi
            - The CUDA runtime DLLs bundled here are everything the binary
              loads; you do NOT need to install the CUDA toolkit separately.

          To run: just double-click NeoEthos.exe (or run from a terminal
          for log output).

          Bundled CUDA runtime: $(${env:CUDA_TOOLKIT_VERSION})
          "@ | Set-Content "$outDir\README.txt"
          Compress-Archive -Path $outDir -DestinationPath "dist\NeoEthos-$version-windows-x64-gpu.zip" -Force

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-gpu
          path: |
            target/release/nsis/*.exe
            dist/*.zip
          if-no-files-found: warn

  # ────────────────────────────────────────────────────────────────────────────
  # Linux GPU release — .tar.gz portable bundle + .deb
  # ────────────────────────────────────────────────────────────────────────────
  build-linux:
    name: Linux (x86_64-gnu, GPU)
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install system dependencies
        # cmake >= 3.28 required by lightgbm-sys; Ubuntu 22.04 ships
        # 3.22 so we pull a newer one from pip.
        # libstdc++-12-dev gives clang the C++ stdlib headers bindgen
        # needs for native crates (lightgbm3-sys).
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config curl unzip mold \
            clang libclang-dev libstdc++-12-dev \
            libasound2-dev libudev-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libxrandr-dev libxcursor-dev \
            libxi-dev libgl1-mesa-dev \
            libwayland-dev libdbus-1-dev \
            python3-pip dpkg-dev
          pip3 install --user 'cmake>=3.28'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          # Pin the repo nightly — dtolnay's RUSTUP_TOOLCHAIN overrides the file.
          toolchain: nightly-2026-04-07

      - name: Cache Cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: linux-cargo-gpu-cuda${{ env.CUDA_TOOLKIT_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            linux-cargo-gpu-cuda${{ env.CUDA_TOOLKIT_VERSION }}-
            linux-cargo-gpu-

      - name: Install CUDA toolkit (Linux)
        uses: Jimver/cuda-toolkit@v0.2.35
        id: cuda-toolkit
        with:
          # 'local' does NOT support sub-packages on Linux (action error);
          # v0.2.35's network method resolves 13.2.0 fine.
          method: 'network'
          cuda: ${{ env.CUDA_TOOLKIT_VERSION }}
          # Jimver prefixes every sub-package with `cuda-`, but NVIDIA's apt
          # repo ships the math libs WITHOUT that prefix (libcublas-dev-13-2,
          # not cuda-libcublas-dev-13-2) → "Unable to locate package". The
          # unprefixed ones go in non-cuda-sub-packages (Linux-only input).
          # `nvrtc-dev` added 2026-08-02: cudarc dlopens libnvrtc to JIT
          # CubeCL kernels. It used to arrive by accident inside the libtorch
          # bundle; with libtorch gone it has to be asked for.
          sub-packages: '["nvcc", "cudart-dev", "nvrtc-dev", "thrust"]'
          non-cuda-sub-packages: '["libcublas-dev", "libcusparse-dev", "libcusolver-dev", "libcurand-dev"]'

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked --version "^0.11"

      - name: Build release binary (GPU)
        run: cargo build -p neoethos-app --release --no-default-features --features "${RELEASE_FEATURES}"

      - name: Create portable tar.gz with the CUDA runtime
        run: |
          set -euo pipefail
          VERSION="${{ github.ref_name || inputs.version }}"
          OUTDIR="dist/NeoEthos-${VERSION}-linux-x64-gpu"
          mkdir -p "$OUTDIR/lib"

          # Binary
          cp target/release/neoethos-app "$OUTDIR/NeoEthos"
          chmod +x "$OUTDIR/NeoEthos"

          # CUDA runtime redistributables. Explicitly named, not globbed: a
          # glob of the toolkit lib64/ would also pull the static archives and
          # the developer-only libraries. libcuda itself is NOT bundled — that
          # is the driver, and it must come from the user's NVIDIA install.
          CUDA_LIB="${CUDA_PATH:-/usr/local/cuda}/lib64"
          if [ ! -d "$CUDA_LIB" ]; then
            echo "::error::CUDA lib dir not found ($CUDA_LIB); the toolkit step did not export CUDA_PATH." >&2
            exit 1
          fi
          staged=0
          for pattern in libcudart.so libnvrtc.so libnvrtc-builtins.so \
                         libcublas.so libcublasLt.so libcurand.so \
                         libcusparse.so libcusolver.so libnvJitLink.so; do
            for lib in "$CUDA_LIB/$pattern"*; do
              [ -e "$lib" ] || continue
              cp -P "$lib" "$OUTDIR/lib/"
              staged=$((staged + 1))
            done
          done
          if [ "$staged" -eq 0 ]; then
            echo "::error::No CUDA runtime libraries matched under $CUDA_LIB — the bundle would ship without a CUDA runtime." >&2
            exit 1
          fi
          echo "staged $staged CUDA runtime libraries"

          # Config + launcher
          cp config.yaml "$OUTDIR/config.yaml"
          cat > "$OUTDIR/run-neoethos.sh" <<'SH'
          #!/usr/bin/env bash
          # Launcher that points the dynamic linker at the bundled CUDA runtime
          DIR="$( cd -- "$( dirname -- "${BASH_SOURCE[0]}" )" &> /dev/null && pwd )"
          export LD_LIBRARY_PATH="$DIR/lib:${LD_LIBRARY_PATH:-}"
          exec "$DIR/NeoEthos" "$@"
          SH
          chmod +x "$OUTDIR/run-neoethos.sh"

          # README
          cat > "$OUTDIR/README.txt" <<EOF
          NeoEthos $VERSION (Linux, GPU)
          =============================

          Runtime requirements:
            - NVIDIA driver supporting CUDA 13.0 or newer (CUDA 13.2 recommended)
              -> verify with: nvidia-smi
            - The CUDA runtime libs bundled in lib/ are everything the binary
              loads; you do NOT need to install the CUDA toolkit separately.

          To run: ./run-neoethos.sh   (the wrapper sets LD_LIBRARY_PATH)
          Or run directly with:
              LD_LIBRARY_PATH=\$(pwd)/lib ./NeoEthos

          Bundled CUDA runtime: ${CUDA_TOOLKIT_VERSION}
          EOF

          tar -czf "dist/NeoEthos-${VERSION}-linux-x64-gpu.tar.gz" -C dist "NeoEthos-${VERSION}-linux-x64-gpu"

      - name: Package .deb (optional, no bundled CUDA runtime)
        # The .deb does not bundle the CUDA runtime (it would push the package
        # past the ~50 MB Debian threshold). It depends on the system CUDA
        # install — useful for ops that prefer apt/dpkg.
        run: cargo packager --release -p neoethos-app --formats deb || true

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-gpu
          path: |
            dist/*.tar.gz
            target/release/debian/*.deb
          if-no-files-found: warn

  # ────────────────────────────────────────────────────────────────────────────
  # Publish GitHub Release with all artifacts
  # ────────────────────────────────────────────────────────────────────────────
  publish:
    name: Publish GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: List artifacts
        run: find release-artifacts -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.version }}
          name: "NeoEthos ${{ github.ref_name || inputs.version }}"
          draft: true
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          body: |
            ## NeoEthos ${{ github.ref_name || inputs.version }} — GPU release

            ### Downloads
            | Platform | File | Notes |
            |----------|------|-------|
            | Windows installer | `NeoEthos-*-setup.exe` | NSIS installer; CUDA runtime + tree-model DLLs bundled |
            | Windows portable  | `NeoEthos-*-windows-x64-gpu.zip` | Unzip and run `NeoEthos.exe` |
            | Linux portable    | `NeoEthos-*-linux-x64-gpu.tar.gz` | Untar and run `./run-neoethos.sh` |
            | Linux .deb        | `*.deb` | System CUDA runtime required (apt install) |

            ### Runtime requirements
            - **Windows / Linux**: NVIDIA driver supporting **CUDA 13.0+** (CUDA 13.2 recommended)
            - CUDA runtime DLLs/.so are bundled inside the archive — no separate CUDA toolkit install required
            - cTrader Open API credentials for live trading (Demo or Live)

            ### What's included
            - GPU-accelerated genetic strategy search (native CUDA kernels + CubeCL)
            - GPU-accelerated statistical / neuro-evolution backends
            - cTrader broker integration via Open API (OAuth, WebSocket)
            - TradingView-style chart with bid/ask + volume
            - Strategy discovery → walkforward → forward-test → prop-firm validation pipeline
            - AI ensemble (XGBoost, CatBoost, LightGBM, Burn deep models)
            - Append-only live trade journal (validation evidence chain)
            - LLM-based news blackout filter
            - Prop-firm risk guard rails

            > **Alpha release** — validated on demo accounts only. Do not use live without further testing.
          files: release-artifacts/**/*
