  label_geometry: symmetric
  label_horizon_bars: 0
  label_neutral_band_atr_fraction: 0.25
  label_stop_atr_multiplier: 0.0
  label_take_profit_rr: 0.0
  walkforward_splits: 15
  embargo_minutes: 120
  discovery_mode: risky
  require_walkforward_for_export: false
  prop_firm_min_pass_rate: 0.0
  search_runtime:
    seed: null
    novelty_weight: 0.2
    stagnation_patience: 2
    tournament_size_override: null
    archive_cap_override: null
    seen_retry_attempts: 16
    smc_gate_start: 0.75
    smc_gate_end: 0.35
    smc_gate_curve: 1.0
    smc_gate_stagnation_step: 0.03
    disable_smc_gate: false
    archive_mode: ''
    archive_min_net: 0.0
    archive_min_pf: 1.0
    archive_min_sharpe: 0.0
    parent_selection: ''
    survivor_selection: ''
    immigrant_ratio: 0.25
    survivor_fraction: 0.1
    selection_temperature: 0.75
    convergence_patience: 250
    min_improvement: 1e-12
    convergence_min_elapsed_fraction: 0.5
  discovery_runtime:
    prefilter_top_k: 240
    prefilter_insample_frac: 0.8
    prefilter_min_per_timeframe: 6
    funnel_stage1_pct: 0.25
    stage1_window: earliest
    min_history_years: 0
    adaptive_thresholds: false
    # Apply the 20% out-of-sample holdout to the GeneticStrategyExpert
    # training path too. The desktop app, the CLI and the batch orchestrator
    # have gone through the holdout wrapper since audit B02/B03 (2026-07-13);
    # that pass missed this call site, so when the TRAINING orchestrator
    # trains the genetic expert it still searches the FULL series and its
    # fitness is entirely in-sample.
    #
    # false = that behaviour, unchanged. Setting true changes which genes the
    # expert produces (the GA now sees 80% of the rows) AND makes the run fail
    # loudly on datasets whose in-sample half is under 64 rows — folds that
    # quietly "succeed" today. Both are improvements; both are changes.
    genetic_expert_holdout: false
    prop_firm_gate:
      max_daily_loss_pct: null
      max_overall_drawdown_pct: null
      profit_target_pct: null
      min_trading_days: null
      window_days: 60
      n_windows: 0
      pass_rate: 0.0
  eval_runtime:
    symbol: null
    account_currency: null
    pip_value: null
    quote_to_account_rate: null
    pip_value_per_lot: null
    spread_pips: null
    commission_per_trade: null
    # true (matches the Rust default): a cross-pair whose quote->account FX rate
    # cannot be resolved returns NaN and the strategy is rejected, rather than
    # emitting money figures knowingly off by the FX rate into the goal report.
    # Set false only to run with knowingly-wrong currency conversion.
    reject_pip_fallback: true
    smc_gate_threshold: 0.75
    smc_w_ob: 1.0
    smc_w_fvg: 1.0
    smc_w_liq: 1.0
    smc_w_mtf: 1.0
    smc_w_premium: 1.0
    smc_w_inducement: 1.0
    smc_w_bos: 1.0
    smc_w_choch: 1.0
    smc_w_eqh: 1.0
    smc_w_eql: 1.0
    smc_w_displacement: 1.0
  quality_runtime:
    min_trades_per_month: 4
    trading_days_per_month: 21.0
  backtest_runtime:
    initial_equity: 100000.0
    month_capacity: 240
    rayon_threads: null
  stop_target_runtime:
    # Cap on the bars the adaptive-stop tail (expected-shortfall) term is
    # computed over. 0 = no cap. Above a non-zero cap the run now FAILS with
    # both numbers named; it used to silently drop the tail term, which on
    # EURUSD M5 changed the median base stop from 18.09 pips (300 000 bars)
    # to 5.81 pips (300 001 bars).
    tail_max_bars: 0
    # Sample the tail every N bars. 1 = every bar. The sampling grid is
    # anchored at the START of whatever slice it is given, so N > 1 makes the
    # stop depend on where the caller's series begins: at the old default of 5,
    # the base over the trailing 300 001 EURUSD M5 bars differed from the same
    # bars of the full-series base by up to 86% PER BAR while the medians
    # agreed to 0.006%. 1 costs 574 ms instead of 206 ms per combo.
    tail_step: 1
  seen_signature_runtime:
    flush_every: 4096
    load_max: 3000000
    max_entries: 3000000
    file_path: null
  discovery_ledger:
    enabled: true
    cache_dir: cache/search
    archive_top_n: 20
    promotion_policy: additive
  smc_search_runtime:
    force_ratio: 0.3
    min_flags: 1
    force_enabled: true
    p_ob: 0.5
    p_fvg: 0.5
    p_liq: 0.5
    p_premium: 0.5
    p_inducement: 0.5
    p_mtf: 0.85
    p_bos: 0.5
    p_choch: 0.5
    p_eqh: 0.5
    p_eql: 0.5
    p_displacement: 0.5
  data_runtime:
    normalize_features: false
    rebuild_stale_higher_tfs: false
  tree_runtime:
    device: auto
    gpu_only: false
    gpu_count: null
    early_stop_patience: null
    early_stop_min_delta: null
    # Let LightGBM use the CUDA tree learner when the build has it and the
    # host has a card. false = LightGBM always trains on the CPU, whatever
    # `device` above says. Flipping this to true changes the arithmetic that
    # trains the model (CUDA histograms sum in a different order), so the
    # trees differ from a CPU run on identical data — compare one run before
    # leaving it on. Inert on a build without --features gpu-cuda.
    lightgbm_gpu: false
  # Device policy for the statistical models (ElasticNet / Logistic).
  #   cpu   — always the CPU path (default; what every build has done so far)
  #   auto  — the CUDA softmax kernel when a card is present, else CPU
  #   gpu / cuda / gpu:N — the CUDA kernel, optionally pinned to device N
  # The two backends are not bit-identical (f32 GPU reductions accumulate
  # differently), so this changes fitted weights and therefore selection.
  statistical_device: cpu
  # The bar a discovered portfolio must clear before /strategy_lab/promotion
  # reports it as promotable. These five numbers were HARD-CODED until
  # 2026-08-02: the loader took Settings and ignored it, so editing config.yaml
  # could not move the gate no matter what the docs said. The values below are
  # exactly the ones that were compiled in, so leaving this block alone keeps
  # today's verdicts identical.
  #
  # Raising any floor (or lowering max_drawdown_pct) rejects portfolios that
  # were promoted before. Mind the units: min_win_rate is a FRACTION (0.45 =
  # 45%), max_drawdown_pct is a PERCENTAGE (25.0 = 25%).
  promotion_gate:
    # false = pass-through, promote whatever discovery finds. Demo only.
    enabled: true
    min_sharpe: 1.0
    min_win_rate: 0.45
    min_profit_factor: 1.2
    max_drawdown_pct: 25.0
    # A stellar Sharpe over 4 trades is noise, not signal.
    min_trades: 30
  prop_metric_weight: 1.0
  prop_accuracy_weight: 0.1
  prop_min_trades: 0
  prop_conf_threshold: 0.55
  enable_cpcv: true
  cpcv_n_splits: 8
  cpcv_n_test_groups: 2
  cpcv_embargo_pct: 0.01
  cpcv_purge_pct: 0.02
  cpcv_min_phi: 0.8
  cpcv_max_rows: 200000
  enable_ddp: false
