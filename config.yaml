    # true (2026-08-09). The static coarse-threshold ladder
    # [0.10, 0.20, 0.35, 0.50, 0.70, 0.90] documents itself in
    # evolution_math.rs:560 as "Calibrated for z-score-normalised features" —
    # and normalize_features was false in both shipped configs AND in the code
    # default, so the ladder was being compared against raw magnitudes spanning
    # ~1e5:1 (RSI ~50, EMA ~1.08, M5 ATR ~5e-4). A 0.35 threshold is
    # unreachable for an ATR term and always-on for an RSI term.
    # derive_adaptive_threshold_ladder_from_features (evolution_math.rs:648)
    # places the six rungs at percentile points of THIS dataset's own magnitude
    # distribution, so a threshold means the same thing on XAUUSD M1 as on
    # EURUSD D1. The old "OnceLock leaks across symbols" caveat was fixed by
    # audit D06 (per-run install/clear).
    # This changes WHAT IS SEARCHED: genes init and mutate onto different
    # thresholds, so runs before and after are not comparable.
    # Fixes the THRESHOLD side only — see models.data_runtime.normalize_features
    # for the weight-ladder half of the same defect.
    adaptive_thresholds: true
    # Apply the 20% out-of-sample holdout to the GeneticStrategyExpert
    # training path too. The desktop app, the CLI and the batch orchestrator
    # have gone through the holdout wrapper since audit B02/B03 (2026-07-13);
    # that pass missed this call site, so when the TRAINING orchestrator
    # trains the genetic expert it still searches the FULL series and its
    # fitness is entirely in-sample.
    #
    # false = that behaviour, unchanged. Setting true changes which genes the
    # expert produces (the GA now sees 80% of the rows) AND makes the run fail
    # loudly on datasets whose in-sample half is under 64 rows — folds that
    # quietly "succeed" today. Both are improvements; both are changes.
    genetic_expert_holdout: false
