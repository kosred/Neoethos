  evo_hidden_size: 64
  evo_population: 32
  evo_islands: 8
  evo_sigma: 0.25
  prop_search_enabled: true
  prop_search_population: 200
  # SEARCH-MORE knob (2026-08-08, default false = today's behaviour). When true
  # and a CUDA card is present, discovery raises the GA population to the
  # card's fits ceiling (min prop_search_population, max 16384) and logs the
  # resolved value. This changes WHAT IS SEARCHED, not just how fast — flip it
  # only after scripts/population-experiment.sh settles whether a bigger
  # population finds better strategies or more of the same.
  prop_search_population_auto: false
  prop_search_generations: 20000
  prop_search_max_hours: 1.0
  prop_search_max_rows: 0
  prop_search_max_rows_by_tf: {}
  prop_search_portfolio_size: 50
  prop_search_max_indicators: 16
  prop_search_checkpoint: models/strategy_evo_checkpoint.json
  # Task #35 fix (2026-08-09): the GA's per-generation population eval routes
  # through the backend selector, which OBEYS this value. `cpu` forced the
  # whole GA — ~97% of a discovery run — onto the CPU while the validation tail
  # (which bypasses the selector and calls the card directly) ran on the GPU.
  # That asymmetry was the 8-month "GA never touches the card" bug. `auto`
  # routes the GA to the native f64 prototype-B population lane when a CUDA card
  # is present, and still falls back to CPU when there is none.
  prop_search_device: auto
  prop_search_train_years: 8
  prop_search_val_years: 1
  prop_search_val_candidates: 0
  prop_search_val_min_positive_months: 0
  prop_search_val_min_trades_per_month: 15
  prop_search_val_min_trades_per_day: 1.0
  prop_search_val_min_monthly_profit_pct: 0.0
  prop_search_val_log_trades: true
  # Decision A (2026-08-09): reject any strategy whose realized average win is
  # under 2x its average loss. This is the REALIZED payoff (avg_win/avg_loss),
  # distinct from risk.min_risk_reward=2.0 which is the SETUP ratio (TP vs SL).
  # 0.0 = off (the pre-2026-08-09 state that let the search buy volume with no
  # payoff margin). An empty portfolio at 2.0 is the honest "2RR is rare" answer.
  prop_search_min_payoff_ratio: 2.0
  prop_search_val_trade_log_max: 50
  prop_search_async: true
  prop_search_async_wait: false
  tree_device_preference: gpu
  regularized_model_defaults: true
  heavy_booster_min_bars: 4000
  ml_cpcv_enabled: true
  prop_search_parent_selection: rank
