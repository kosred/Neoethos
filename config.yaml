# ============================================================================
# DEVELOPER EXPERIMENT PROFILE — OVERRIDES ONLY. NOT the config a run reads.
# ============================================================================
#
# Generated by crates/neoethos-core/tests/shipped_config_matches_defaults.rs
# (`the_repo_profile_carries_only_its_overrides`). Every key BELOW differs from
# `neoethos_core::config::Settings::default()`. Every key NOT below is the code
# default, deliberately absent so that it cannot contradict one.
#
# THE SCHEME (docs/config-single-source-of-truth.md):
#
#   * The Rust `Default` impls are the SINGLE SOURCE OF DEFAULT VALUES.
#   * desktop/src-tauri/resources/config.yaml is GENERATED from those defaults
#     and fails the build if it drifts.
#   * The operator's store (%LOCALAPPDATA%\neoethos\config.yaml) is the ONLY
#     file a run reads, and carries HIS overrides only. Convert it with
#     `neoethos-cli config normalize --write` — never by hand.
#   * THIS FILE is read by NOTHING unless you point $CONFIG_FILE at it.
#
# HOW TO RUN A LOCAL EXPERIMENT WITH A DIFFERENT SETTING:
#
#     Copy-Item config.yaml my-experiment.yaml     # edit the copy
#     $env:CONFIG_FILE = 'my-experiment.yaml'
#     cargo run -p neoethos-cli -- discover
#
# $CONFIG_FILE is the FIRST branch of the resolution order and the ONLY
# supported way to point a run at a different file. The bare relative
# "config.yaml" fallback is DELETED: until 2026-08-10 the same binary read a
# different config depending on the directory it was started from, so simply
# being in the repo root silently turned the OOS export gate off. A run now
# logs, by name, which file it opened — or that it opened none.
#
# TO ADD AN OVERRIDE: add the key here. If it is on the PINNED list in the
# generating test you must also register the value AND the reason in
# ROOT_REGISTERED, or the test fails naming your key. To REMOVE an override,
# delete the line; the code default takes over.
# ============================================================================
#
# WHY EACH KEY BELOW DIVERGES FROM THE CODE DEFAULT
# (unannotated keys are ordinary developer tuning; the ones with a
#  reason are decisions that neither side may move alone)
#
#   models.discovery_mode
#     INERT. discovery.rs maps only `strict|legacy`; `risky` — and the live
#     store's `prop_firm` — fall through to system.trading_mode.
#     Restricting the accepted values is routed (pending-A A6) and blocked on
#     the TUI, which offers exactly the two values the engine does not
#     honour.
#
#   models.l1_feature_selection_enabled
#     2026-08-10. Default is false. This changes WHAT IS SEARCHED — L1
#     selection prunes the feature set before the GA sees it — so it is
#     recorded, not reconciled. The value has been in this profile throughout
#     the runs the current results came from; flipping it to match the
#     default would silently change the search on the next run, which is
#     precisely what this table exists to prevent.
#
#   models.l1_feature_selection_per_regime
#     2026-08-10. Default is false. The per-regime half of the same decision;
#     see above. Both move together — enabling selection globally while
#     disabling it per regime is a combination nothing in the profile
#     intended.
#
#   models.prop_firm_min_pass_rate
#     Same 2026-06-06 mandate: 0.65 -> 0.40 -> 0.0, where 0.0 is RANKING-ONLY
#     (the window pass-rate still orders candidates, it kills none). Default
#     is 0.40.
#
#   models.regime_router_enabled
#     Shipped on against a Default of false. Enabling a router is the
#     stricter, more selective side, so the safer value wins here and the
#     disagreement is recorded rather than reconciled.
#
#   models.require_walkforward_for_export
#     2026-06-06 regime-diversity mandate, quoted verbatim in the file: a
#     hard all-period OOS export gate kills regime specialists, which is what
#     the library is collecting. Walk-forward still RUNS and is recorded per
#     strategy. Default is true. STILL OPEN —
#     docs/audit-status-2026-08-09.md #322 asks whether false is the right
#     posture and says it needs an OOS measurement.
#
#   models.tree_device_preference
#     2026-08-10. Default is `auto`. The repo profile asks for the card
#     explicitly, which is the standing GPU invariant (#35): a machine WITH a
#     card must run on it or fail loudly, never quietly fall back to CPU and
#     report a number that took 20x longer. Registered rather than reconciled
#     because `auto` and `gpu` are NOT the same request — the refuters
#     overturned merging this with `models.tree_runtime.device`, and the two
#     keys stay distinct.
#
#   risk.challenge_mode
#     UNWIRED — RiskManager has no production constructor and fills its
#     challenge targets from a hardcoded FTMO_STANDARD. Default is false;
#     both repo files shipped true, i.e. an armed mode that does not exist.
#     RETAINED AS INTENT: deleting it deletes the prop-firm goal, not
#     garbage.
#
#   risk.daily_drawdown_limit
#     CORRECTED 2026-08-10 from 0.10000000149011612 — an f32 value widened
#     to f64, i.e. machine-written, not chosen. 0.08 is
#     NONE_OWN_MONEY.daily_dd_stop_trading_pct, which is the right source
#     because this file runs `preset: none`. NOT 0.04 — that is FTMO's
#     number and belongs in the live store, which runs `preset: ftmo`.
#     Registered because if the Default is preset-derived these agree, and if
#     it is not, the disagreement is a decision rather than drift.
#
#   risk.max_portfolio_risk
#     The risky profile's portfolio cap. NOTE the live store carries 0.0,
#     which under the current reading means NO CAP AT ALL rather than 'no
#     risk' — that ambiguity is being turned into a loud startup error
#     naming both readings, never a silent correction.
#
#   risk.total_drawdown_limit
#     CORRECTED 2026-08-10 from 0.20000000298023224 — same f32 fingerprint,
#     same writer. 0.14 = NONE_OWN_MONEY.max_overall_drawdown_pct 0.20 x the
#     0.7 buffer. The live store's 0.07 is FTMO's 0.10 x 0.7 and is correct
#     there. The two files were answering for two different presets and
#     nothing said so.
#
#   system.multi_resolution_enabled
#     The seed comment calls the true path 'the pre-GA wall that stopped
#     combos completing on laptop AND VPS' — every combo serially reloaded
#     M1's 5.27M rows and fed M1 noise into coarse-TF strategies. Default is
#     true, so a key-less install RE-CREATES the wall. The operator's live
#     store has true.
#
#   system.trading_mode
#     The profile this file exists to describe. NOT merged with
#     models.discovery_mode — that merge was overturned by the refuters and
#     is never to be executed.
#
# ============================================================================
