# ============================================================================
# THIS FILE IS NOT THE CONFIGURATION A RUN READS. (2026-08-10)
# ============================================================================
#
# Four config surfaces existed and exactly one was ever read:
#
#   1. the Rust `Default` impls in crates/neoethos-core/src/config.rs
#   2. THIS FILE                                     (repo root, 383 keys)
#   3. desktop/src-tauri/resources/config.yaml       (233 keys, a strict subset)
#   4. %LOCALAPPDATA%\neoethos\config.yaml           — THE OPERATOR'S LIVE STORE
#
# `Settings::load()` reads $CONFIG_FILE, else the live store IF IT EXISTS, else
# the literal relative path "config.yaml". The live store exists. **Every run
# on this machine reads surface 4 and nothing else.** Surfaces 2 and 3 were
# documentation that lied: 150 keys present here were absent from the seed, and
# five shared keys disagreed — all five on the money path.
#
# THE SCHEME NOW IN FORCE (docs/config-single-source-of-truth.md):
#
#   * The Rust `Default` impls are the SINGLE SOURCE OF DEFAULT VALUES.
#   * desktop/src-tauri/resources/config.yaml is GENERATED from
#     `Settings::default()` and regenerated by
#     crates/neoethos-core/tests/generated_seed_is_current.rs. It cannot drift,
#     because a Default change that is not mirrored into it fails the build.
#   * The operator's live store carries ONLY his overrides. It is migrated by
#     scripts/migrate_live_config.ps1 — never silently, never unattended.
#   * THIS FILE is the repo's annotated DEVELOPER EXPERIMENT PROFILE. It is not
#     installed, not shipped, and not a source of defaults.
#
# HOW A DEVELOPER RUNS A LOCAL EXPERIMENT WITH A DIFFERENT SETTING:
#   set CONFIG_FILE=config.yaml           (PowerShell: $env:CONFIG_FILE='config.yaml')
# $CONFIG_FILE is the FIRST branch of the resolution order and is the only
# supported way to point a run at a file other than the live store. Copy this
# file, edit the copy, point $CONFIG_FILE at it. The run logs, by name, which
# file it opened — so an experiment can never be mistaken for a normal run.
#
# WHAT THIS FILE IS STILL ALLOWED TO DO: tune. What it is NOT allowed to do is
# disagree with a Default without saying so. Every guarded key below is pinned
# by crates/neoethos-core/tests/shipped_config_matches_defaults.rs, which also
# rejects any key here that is not a field of `Settings` — the defect that let
# `export_onnx`, `news_kill_window_min`, `news_lookahead_minutes` and
# `perplexity_enabled` sit in the operator's live store for months after their
# fields were deleted.
# ============================================================================
