risk:
  preset: none
  initial_balance: 10000.0
  monthly_profit_target_pct: 0.0
  min_risk_per_trade: 0.0
  max_risk_per_trade: 0.03
  risk_per_trade: 0.03
  # Decision (2026-08-09): Risky mode chases 100 -> 50k in ~6 months, so its
  # risk CEILING is 30% per trade. This is a ceiling the growth objective sizes
  # UP TO only when the edge justifies it (below ~43% WR at 2RR, 30% is
  # geometric ruin and the objective declines it). PropFirm keeps the 3% band.
  risky_max_risk_per_trade: 0.30
  max_portfolio_risk: 0.34
  daily_drawdown_limit: 0.10000000149011612
  total_drawdown_limit: 0.20000000298023224
  min_risk_reward: 2.0
  max_lot_size: 10.0
  require_stop_loss: true
  challenge_mode: true
  challenge_phase: phase_1
  prop_firm_rules: false
  kill_zones_enabled: true
  max_trades_per_day: 8
  # Arms the cap above. OFF by default — nothing changes until you set it
  # true. When armed the cap is ACCOUNT-WIDE per UTC day: one shared counter
  # across every running engine, so 4 engines do NOT get 8 each — the account
  # gets 8 total. Every refusal is logged with the rule, the day's count and
  # the cap. Counter resets at UTC midnight and on app restart; the cap value
  # 0 disables. (Measured on the real journal: armed at 8 this would have
  # refused 68.1 % of historical entries — arm it deliberately.)
  max_trades_per_day_enabled: false
  recovery_mode_enabled: true
  feature_drift_threshold: 0.3
  high_quality_confidence: 0.65
  atr_period: 14
  atr_stop_multiplier: 1.5
  triple_barrier_max_bars: 35
  trailing_enabled: true
  trailing_atr_multiplier: 1.0
  trailing_be_trigger_r: 1.0
  slippage_pips: 0.5
  commission_per_lot: 7.0
  backtest_spread_pips: 1.5
  conformal_enabled: true
  conformal_alpha: 0.1
  conformal_abstain_min_set_size: 3
  meta_label_max_hold_bars: 100
  meta_label_min_dist: 0.0005
  meta_label_fixed_sl: 0.002
  meta_label_fixed_tp: 0.004
  vol_horizon_bars: 5
