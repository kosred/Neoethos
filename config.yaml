  # It is NOT merged with `trading_mode` (that merge was overturned:
  # discovery_mode reaches `Strict`, which trading_mode structurally cannot).
  # It is being RESTRICTED to strict|legacy, and the fall-through is being made
  # loud. When that lands this key must become `legacy` or be removed — with
  # `system.trading_mode: risky` above, removal is behaviour-neutral. Left as-is
  # now because guessing the mapping of a money-path mode is not something this
  # wave will do blind.
  discovery_mode: risky
  # ⚠ GATE DISAGREEMENT, DELIBERATE AND DATED. The Rust Default is `true`
  # (hard out-of-sample export gate). This file, the seed and the live store all
  # ship `false`, on the operator's 2026-06-06 regime-diversity mandate quoted
  # below: a hard all-period OOS gate kills regime specialists, which is exactly
  # what the library is trying to collect. Walk-forward still RUNS and is
  # recorded per strategy; it just does not block export.
  #
  # This is NOT drift and it is NOT reconciled to the Default by this wave —
  # tightening it would refuse portfolios that export today, and that is the
  # operator's call, not a cleanup's. It is REGISTERED in
  # crates/neoethos-core/tests/shipped_config_matches_defaults.rs so neither
  # side can move again without someone editing the registry and saying why.
  # It also remains open: docs/audit-status-2026-08-09.md #322 asks whether
  # `false` is still the right posture and says it needs an OOS measurement.
  require_walkforward_for_export: false
  # ⚠ SAME SHAPE. Rust Default 0.40; all three files ship 0.0. 2026-06-06
  # mandate: 0.65 -> 0.40 -> 0.0, where 0.0 = RANKING-ONLY (the prop-firm
  # window pass-rate still orders candidates, it just kills none). Registered,
  # not reconciled.
  #
  # 💰 It is combined with `models.discovery_runtime.prop_firm_gate.pass_rate`
  # by a `.max()` in discovery.rs, and the mandate above names only THIS key —
  # so raising the other one silently overrides the disarm. While both fields
  # exist the SAFER (higher) value wins and the disagreement is logged with both
  # numbers; the collapse to one field is shard A/E.
  prop_firm_min_pass_rate: 0.0
