  # population finds better strategies or more of the same.
  prop_search_population_auto: false
  prop_search_generations: 20000
  prop_search_max_hours: 1.0
  prop_search_max_rows: 0
  prop_search_max_rows_by_tf: {}
  prop_search_portfolio_size: 50
  prop_search_max_indicators: 16
  prop_search_checkpoint: models/strategy_evo_checkpoint.json
  # Task #35 fix (2026-08-09): the GA's per-generation population eval routes
  # through the backend selector, which OBEYS this value. `cpu` forced the
  # whole GA — ~97% of a discovery run — onto the CPU while the validation tail
  # (which bypasses the selector and calls the card directly) ran on the GPU.
  # That asymmetry was the 8-month "GA never touches the card" bug. `auto`
  # routes the GA to the native f64 prototype-B population lane when a CUDA card
  # is present, and still falls back to CPU when there is none.
  prop_search_device: auto
  prop_search_train_years: 8
  prop_search_val_years: 1
  prop_search_val_candidates: 0
  prop_search_val_min_positive_months: 0
  prop_search_val_min_trades_per_month: 15
  prop_search_val_min_trades_per_day: 1.0
  prop_search_val_min_monthly_profit_pct: 0.0
  prop_search_val_log_trades: true
  # Decision A (2026-08-09): reject any strategy whose realized average win is
  # under 2x its average loss. This is the REALIZED payoff (avg_win/avg_loss),
  # distinct from risk.min_risk_reward=2.0 which is the SETUP ratio (TP vs SL).
  # 0.0 = off (the pre-2026-08-09 state that let the search buy volume with no
  # payoff margin). An empty portfolio at 2.0 is the honest "2RR is rare" answer.
  prop_search_min_payoff_ratio: 2.0
  # THE PRIMARY SURVIVAL GATE (2026-08-09). Cost-charged net expectancy per
  # trade, in account currency. 0.0 does NOT mean "off" — it means "must be
  # strictly greater than zero", and there is no value that admits a
  # money-loser (the loader floors it at 0.0).
  #
  # It exists because the payoff floor above cannot do this job. Measured on
  # real EURUSD bars while sweeping the trailing stop: payoff 0.91 at
  # expectancy -4.15 pips/trade, payoff 2.53 at expectancy -4.18 pips/trade.
  # The payoff ratio moved 2.8x; the money did not move at all. A 2.0 payoff
  # floor accepts the second and rejects the first, and the second loses
  # slightly faster. Payoff describes the SHAPE of the win/loss split; only
  # expectancy describes the direction of the money.
  prop_search_min_net_expectancy_per_trade: 0.0
  # How many standard errors above zero that expectancy must sit
  # (mean / (sd / sqrt(n))). 0.0 = sign only, which is the default because
  # choosing a significance bar is an operator decision, not a correctness
  # bound. ~2.0 refuses candidates whose positive expectancy is inside its own
  # noise. NOTE this bounds SAMPLING noise on one candidate's own trades; it
  # says nothing about selection bias across the thousands the GA tried, which
  # needs DSR/PBO over per-trial return series we do not yet persist.
  prop_search_min_expectancy_t_stat: 0.0
  # Discovery exit geometry (2026-08-09). Was three literals in
  # crates/neoethos-search/src/genetic/strategy_gene.rs with no config
  # recipient, so no run in fourteen months could measure the search without
  # them.
  #
  # What they did: the trail is applied BEFORE the take-profit check on every
  # bar after entry, and `trailing_stop_multiplier` is a multiple of the
  # position's OWN STOP, not of ATR. At trigger 1.0 / multiplier 1.0 the stop
  # sits at entry the instant a trade touches +1R, so reaching 3R means
  # climbing 1R->3R without ever retracing 1R from the running high. Measured:
  # realised payoff 0.87 at tp 45 AND 0.87 at tp 300 (avg win 6.10 vs 6.11
  # pips) — the take-profit was dead code. Best payoff anywhere in the grid,
  # all timeframes: 1.08, against the 2.0 floor above. "174 screened, 0
  # survived" was arithmetic, not a finding about the market.
  #
  # trailing_enabled: false is the change. It buys NO expected profit —
  # expectancy stayed at -4.15 pips/trade in EVERY trailing configuration. It
  # is DIAGNOSTIC: it makes the question askable. What it refuses is the
  # automatic move-to-break-even at +1R that lowered drawdown enough for
  # candidates to clear the prop-firm gate; set it back to true to get that.
  exit_policy:
    trailing_enabled: false
    trailing_be_trigger_r: 1.0
    trailing_stop_multiplier: 1.0
    trailing_min_lock_pips: 2.0
  # The stop/target band the GA may draw and mutate within (2026-08-09), in
  # MULTIPLES OF THIS DATASET'S MEDIAN ATR rather than absolute pips.
  #
  # It used to be four literals: sl in [6, 20] pips, tp in [12, 45] pips,
  # reward:risk sampled in [1.5, 2.5]. Those are M5 numbers. On H1 (ATR ~12
  # pips) the entire stop band sits inside one bar's range; on H4 (ATR ~30
  # pips) it sits below it — so "search a higher timeframe" was advice the
  # search could not act on. The band also excluded the reward:risk its own
  # payoff floor demanded: payoff with barriers only is (tp-c)/(sl+c), so a 2.0
  # floor needs tp >= 2*sl + 3*c = 48.67 at sl 20, c 2.89 — outside the 45-pip
  # ceiling, and no draw ever sampled above 2.5R.
  #
  # Set atr_scaled: false to reproduce a pre-2026-08-09 run; the absolute band
  # below is then used verbatim. Widening the band buys no expected profit — it
  # changes which shapes are REACHABLE, and the expectancy gate decides which of
  # them survive.
  gene_stop_bounds:
    atr_scaled: true
    sl_min_atr: 1.0
    sl_max_atr: 4.0
    rr_min: 1.5
    rr_max: 4.0
    sl_min_pips: 6.0
    sl_max_pips: 20.0
    tp_min_pips: 12.0
    tp_max_pips: 45.0
  prop_search_val_trade_log_max: 50
  prop_search_async: true
  prop_search_async_wait: false
  tree_device_preference: gpu
  regularized_model_defaults: true
  heavy_booster_min_bars: 4000
  ml_cpcv_enabled: true
