risk:
  preset: none
  initial_balance: 10000.0
  monthly_profit_target_pct: 0.0
  min_risk_per_trade: 0.0
  max_risk_per_trade: 0.03
  risk_per_trade: 0.03
  # Decision (2026-08-09): Risky mode chases 100 -> 50k in ~6 months, so its
  # risk CEILING is 30% per trade. This is a ceiling the growth objective sizes
  # UP TO only when the edge justifies it (below ~43% WR at 2RR, 30% is
  # geometric ruin and the objective declines it). PropFirm keeps the 3% band.
  risky_max_risk_per_trade: 0.30
  # 💰 0.0 IN THE LIVE STORE MEANS **NO CAP AT ALL**, not "no risk". A knob
  # whose name is a maximum must not use 0 to mean "off". That reading is being
  # turned into a LOUD STARTUP ERROR naming both interpretations
  # (crates/neoethos-core/src/config.rs, shard A) rather than silently
  # re-interpreted — changing what a money limit means without the operator
  # saying so is the one thing this wave will not do.
  max_portfolio_risk: 0.34
  # ============================================================================
  # 💰 CORRECTED 2026-08-10 — machine-written raw ceilings, not operator intent.
  #
  #   daily_drawdown_limit  was 0.10000000149011612   ->  0.08
  #   total_drawdown_limit  was 0.20000000298023224   ->  0.14
  #
  # Those two fingerprints are f32 values widened to f64. No human types
  # 0.10000000149011612. They were written by crates/neoethos-app/src/server/
  # risk.rs, which persisted the prop firm's RAW ceiling instead of the BUFFERED
  # one. That writer has since been fixed (it now seeds from the buffered numbers
  # and never widens a breaker that is already tighter on disk), so a UI preset
  # click no longer puts 0.10 / 0.20 back. This edit just gets there by hand.
  #
  # WHERE THE NUMBERS COME FROM — and this matters, because the obvious answer is
  # the wrong one. THIS FILE RUNS `preset: none` (below), i.e. own money, so the
  # source is PropFirmRuntimeDefaults::NONE_OWN_MONEY:
  #
  #   daily : NONE_OWN_MONEY.daily_dd_stop_trading_pct              = 0.08
  #   total : NONE_OWN_MONEY.max_overall_drawdown_pct 0.20 x 0.7    = 0.14
  #
  # ⚠ NOT 0.04 / 0.07. Those are FTMO's numbers, and this profile is not on FTMO.
  # 0.04 would be tighter, so it is not dangerous — but it would put a THIRD
  # unexplained number in the file and break agreement with RiskConfig::default(),
  # which is the exact defect being closed. The operator's LIVE STORE carries
  # 0.04 / 0.07 and that is correct THERE, because his live store runs
  # `preset: ftmo`. The two files were never really in conflict; they were
  # answering for two different presets, and nothing said so.
  #
  # WHAT CHANGES: on a GBP 1,000 account the daily breaker arms at 80 lost
  # instead of 100, the total at 140 instead of 200. Both REFUSE trading earlier
  # than today. Nothing is permitted that was not permitted before.
  # ============================================================================
  daily_drawdown_limit: 0.08
  total_drawdown_limit: 0.14
  min_risk_reward: 2.0
  max_lot_size: 10.0
  require_stop_loss: true
  # ⚠ UNWIRED — RiskManager has no production constructor. `challenge_mode`,
  # `challenge_phase`, `recovery_mode_enabled` and `monthly_profit_target_pct`
  # reach only crates/neoethos-core/src/domain/risk.rs, whose three constructors
  # all live inside its own test module, and whose monthly/challenge targets are
  # filled from a hardcoded FTMO_STANDARD regardless of what is set here. The
  # Rust Default is `false`; both repo files shipped `true`. That is an armed
  # mode that does not exist. RETAINED AS INTENT — deleting these deletes the
  # prop-firm GOAL, not garbage. Decide the subsystem as one item.
  challenge_mode: true
  challenge_phase: phase_1
  # `prop_firm_rules` REMOVED 2026-08-10. One write, one display read, zero
  # decisions — it never gated anything. It shipped `false` here and `true` in
  # both the desktop seed and the operator's live store, which is how a knob
  # that decides nothing still manages to look like a money divergence. The
  # field itself is deleted from RiskConfig in the same wave (shard A); leaving
  # the key here would become a hard load failure once `deny_unknown_fields` is
  # on. The DTO/UI side is forbidden territory — see
  # docs/pending-edits-forbidden-territory.md.
  kill_zones_enabled: true
  max_trades_per_day: 8
  # Arms the cap above. OFF by default — nothing changes until you set it
  # true. When armed the cap is ACCOUNT-WIDE per UTC day: one shared counter
  # across every running engine, so 4 engines do NOT get 8 each — the account
  # gets 8 total. Every refusal is logged with the rule, the day's count and
  # the cap. Counter resets at UTC midnight and on app restart; the cap value
  # 0 disables. (Measured on the real journal: armed at 8 this would have
  # refused 68.1 % of historical entries — arm it deliberately.)
  max_trades_per_day_enabled: false
  recovery_mode_enabled: true
  feature_drift_threshold: 0.3
  high_quality_confidence: 0.65
  atr_period: 14
  atr_stop_multiplier: 1.5
  triple_barrier_max_bars: 35
  # ⚠ UNWIRED / SHADOWED DUPLICATE — 💰 AND THE SHARPEST TWIN IN THE PROJECT.
  #
  # `trailing_enabled`, `trailing_be_trigger_r` and `trailing_min_lock_pips`
  # exist on BOTH `RiskConfig` and `ExitPolicyConfig` as of 2026-08-09. THE
  # SEARCH READS THE ExitPolicy COPY (models.exit_policy, below). THE OPERATOR'S
  # LIVE STORE SETS THIS COPY — including hand-tuned
  # `trailing_atr_multiplier: 0.4` and `trailing_be_trigger_r: 0.1`, deliberate
  # values that move absolutely nothing.
  #
  # Meanwhile LIVE EXECUTION trails UNCONDITIONALLY with no config recipient at
  # all (crates/neoethos-app/.../live_trading.rs). So deleting these keys now
  # would convert a visibly-wrong value into an INVISIBLE HARDCODE on the path
  # that spends real money. They are therefore MARKED and KEPT. The deletion is
  # blocked until live execution is wired to models.exit_policy — that order,
  # never the reverse. See docs/pending-edits-forbidden-territory.md.
  #
  # Do not edit these expecting a behaviour change; edit models.exit_policy.
  trailing_enabled: true
  trailing_atr_multiplier: 1.0
  trailing_be_trigger_r: 1.0
  slippage_pips: 0.5
  commission_per_lot: 7.0
  # Is commission_per_lot the charge for ONE SIDE or for the round trip?
  # Brokers quote per side (45 USD/million ≈ 0.62 pips per side on EURUSD, so
  # ≈ 1.24 pips round trip before spread), and every evaluator here — CPU
  # eval.rs, the CUDA kernel, the C prototype — subtracts commission_per_trade
  # exactly ONCE per closed trade. With a per-side number in the field the
  # backtest charged half the real commission on every trade. true doubles it
  # once, at the resolvers, so downstream means ROUND TRIP.
  # 2026-08-09 behaviour change: charged commission goes $7 -> $14 per lot per
  # closed trade (~1.4 pips on a EURUSD standard lot instead of 0.7).
  commission_per_lot_is_per_side: true
  backtest_spread_pips: 1.5
  # Session-aware backtest spread (pips) for the three UTC buckets the
  # evaluator already resolves per bar: Asian 22-07, Overlap 07-16, Late NY
  # 16-22. The mechanism exists on BOTH the CPU path (eval.rs:843) and the
  # CUDA kernel (prototype_b_population.cu spread_pips_for_bar) and until
  # 2026-08-09 it was populated ONLY under #[cfg(test)] — so a flat spread was
  # charged at 03:00 Tokyo and at the London open alike.
  #
  # Set ALL THREE together or none: a partial curve is a config ERROR, not a
  # silent fall-back to flat. slippage_pips is added to each bucket exactly as
  # it is added to backtest_spread_pips. Left null because this project does
  # not invent broker numbers. YOU ALREADY HAVE THE MEASUREMENT: the app's
  # spread-stats sampler (crates/neoethos-app/src/app_services/spread_stats.rs)
  # has been recording per-(symbol, UTC-hour) mean/max spread from the broker's
  # own ticks into <data_dir>/spread_stats.json, and it says in its own header
  # that the eval kernels are its intended consumer. Average its hourly means
  # over 22-07, 07-16 and 16-22 and put the three numbers here.
  # Until then the run WARNs that it is charging a flat spread.
  backtest_spread_pips_asian: null
  backtest_spread_pips_overlap: null
  backtest_spread_pips_late_ny: null
  # Round-trip cost band, in pips, that every reported result is measured
  # against. A result that clears the optimistic edge but not the pessimistic
  # one is FLAGGED optimistic_edge_only — which is to say, not a result. Never
  # adopt a single "true cost" number: nobody knows theirs to a tenth of a pip.
  #
  # ⚠ THE BAND MUST BRACKET THE COST THE RUN ALREADY CHARGES, or it cannot
  # discriminate. The edges REPLACE the whole cost (spread + commission), and
  # cost is monotone, so anything cheaper than the baseline is cleared by
  # construction. At the values shipped here the baseline is
  # backtest_spread 1.5 + slippage 0.5 + commission 14 USD/lot / 10 USD/pip
  # = 3.4 pips round trip — ABOVE both edges. The run therefore SKIPS the band
  # and marks every survivor cost_band_not_discriminating with an ERROR naming
  # both numbers, rather than producing a census that reads clean on every run.
  # These stay at the operator's own 1.6/2.4 spec: the mismatch is a fact about
  # the charged cost, and silently moving the band would hide it.
  cost_band_optimistic_pips: 1.6
  cost_band_pessimistic_pips: 2.4
  conformal_enabled: true
  conformal_alpha: 0.1
  conformal_abstain_min_set_size: 3
  meta_label_max_hold_bars: 100
  meta_label_min_dist: 0.0005
  meta_label_fixed_sl: 0.002
  meta_label_fixed_tp: 0.004
  vol_horizon_bars: 5
