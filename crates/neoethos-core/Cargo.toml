[package]
name = "neoethos-core"
version = "0.5.6"
edition.workspace = true
license.workspace = true

[features]
default = []
# Compile-time runtime inventory. Hardware discovery must advertise only
# backends that the current binary can actually execute.
gpu-cuda = []

[dependencies]
neoethos-execution-budget.workspace = true
neoethos-broker-truth.workspace = true
neoethos-dataset-contracts.workspace = true
rayon.workspace = true
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml_ng = "0.10.0"
config = "0.15.19"
tracing = "0.1.42"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "json"] }
# tracing-appender: daily-rotating file logger. Wired into `logging::setup_logging`
# alongside the console layer so each session writes to
# `<user-data-dir>/neoethos/logs/neoethos.YYYY-MM-DD.log`. Old files (> 7 days)
# are deleted at startup to keep the directory clean — the user explicitly
# requested "logs of today, not garbage from days/months ago".
tracing-appender = "0.2.4"
# Platform-correct user-data dir for log storage. Same version as neoethos-app.
dirs = "5.0.1"
# F-102 fix (2026-05-25): `tokio` removed from neoethos-core dependencies.
# Verified via `grep "use tokio|tokio::|#[tokio::"` — ZERO call sites in
# the entire crate. The previous `features = ["full"]` pulled the
# complete tokio runtime (~50 transitive crates) into a foundation
# layer that does nothing async. Crates that DO need tokio (e.g.
# neoethos-app, neoethos-cli) depend on it directly with minimal
# features instead.
# 0.39.6 keeps the hardware probe on the current sysinfo API and Windows
# dependency family used directly by this crate.
# API surface we use (System::{new,new_all,refresh_all,refresh_memory,
# refresh_cpu_usage,refresh_processes,cpus,total_memory,available_memory,
# used_memory,physical_core_count,name,os_version}, Cpu::{brand,cpu_usage},
# Pid::from_u32, ProcessesToUpdate, Process::start_time,
# MINIMUM_CPU_UPDATE_INTERVAL) is untouched across 0.37→0.39: the whole
# 0.38.0/0.39.0 breaking sections are NetBSD support, MacAddr/file_system
# serde shapes and two additive APIs we do not call.
# MSRV: 0.39 requires rustc 1.95; rust-toolchain.toml pins 1.96.0-nightly.
#
sysinfo = "0.39.6"
anyhow = "1.0.100"
thiserror = "2.0.16"
chrono = { version = "0.4.44", features = ["serde"] }
# NB (2026-08-09, D3 purge): `uuid`, `ndarray` and `secrecy` were removed
# here because their last consumers in this crate were the orphaned
# `domain::{events, portfolio, news_filter}` modules. `secrecy` in
# particular guarded an LLM API key on a `NewsFilter` nothing constructed;
# if a real secret-holding type lands in core, bring the dep back WITH it.
# TOML serializer for the broker credentials file. Owns the
# canonical on-disk shape so both neoethos-app and neoethos-cli can
# read + write `broker_credentials.toml` without a workspace cycle.
toml = "0.8.20"
[target.'cfg(windows)'.dependencies]
# Only the Win32 surfaces called by this crate:
#   - `Win32_System_Console` — CLI console-mode detection
#   - `Win32_System_SystemInformation` — live allocation/commit headroom
#   - `Win32_UI_WindowsAndMessaging` — the startup MessageBox dialog
#     in `logging.rs:140` (no-tty fallback)
#   - `Win32_Foundation` — required by the WindowsAndMessaging types
# Use a compatible 0.62 release rather than an exact patch pin for the Win32
# APIs this crate calls directly.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_SystemInformation",
    "Win32_UI_WindowsAndMessaging",
] }
