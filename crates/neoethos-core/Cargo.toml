[package]
name = "neoethos-core"
version = "0.5.6"
edition.workspace = true
license.workspace = true

[features]
default = []
# Compile-time runtime inventory. Hardware discovery must advertise only
# backends that the current binary can actually execute.
gpu-cuda = []
gpu-rocm = []
gpu-wgpu = ["dep:wgpu", "dep:pollster"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml_ng = "0.10.0"
config = "0.15.19"
tracing = "0.1.42"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "json"] }
# tracing-appender: daily-rotating file logger. Wired into `logging::setup_logging`
# alongside the console layer so each session writes to
# `<user-data-dir>/neoethos/logs/neoethos.YYYY-MM-DD.log`. Old files (> 7 days)
# are deleted at startup to keep the directory clean — the user explicitly
# requested "logs of today, not garbage from days/months ago".
tracing-appender = "0.2.4"
# Platform-correct user-data dir for log storage. Same version as neoethos-app.
dirs = "5.0.1"
# F-102 fix (2026-05-25): `tokio` removed from neoethos-core dependencies.
# Verified via `grep "use tokio|tokio::|#[tokio::"` — ZERO call sites in
# the entire crate. The previous `features = ["full"]` pulled the
# complete tokio runtime (~50 transitive crates) into a foundation
# layer that does nothing async. Crates that DO need tokio (e.g.
# neoethos-app, neoethos-cli) depend on it directly with minimal
# features instead.
sysinfo = "0.37.2"
anyhow = "1.0.100"
thiserror = "2.0.16"
# PINNED. Current is 0.40.1 (crates.io, 2026-06-06); we are three minors back.
#
# REPRODUCED 2026-08-03, not argued: setting 0.40.1 here makes the resolver
# refuse outright —
#   package `libsqlite3-sys` links to the native library `sqlite3`, but it
#   conflicts with a previous package which links to `sqlite3` as well:
#     libsqlite3-sys v0.38.1  <- rusqlite v0.40.1  <- neoethos-core
#     libsqlite3-sys v0.35.0  <- rusqlite v0.37.0  <- burn-dataset v0.21.0
#
# THE COUNTER-ARGUMENT THAT LOOKS RIGHT AND IS NOT — recorded because it was
# made twice and cost a round trip both times. `cargo tree -i burn-dataset`
# prints "nothing to print": burn-core's default set is
# ["std","burn-std/default","burn-dataset?/default","burn-tensor/default"], and
# the `?` means burn-dataset is never ACTIVATED. True, and irrelevant. `links`
# uniqueness is enforced on the RESOLVE graph, which contains unactivated
# optional dependencies; `cargo tree` shows the BUILD graph, which does not. So
# we pay a version pin for a crate we never compile, and `default-features =
# false` on burn cannot buy it back.
#
# 0.37.0 is the LAST rusqlite on libsqlite3-sys ^0.35 — 0.38.0 already moved to
# ^0.36 — so there is no intermediate hop to take.
#
# TRIGGER CONDITION, check this and nothing else: a published `burn-dataset`
# that requires rusqlite > ^0.37. Verify LIVE at
# https://crates.io/api/v1/crates/burn-dataset — the local cargo index is stale
# and has given wrong answers. As of 2026-08-03, burn-dataset 0.22.0-pre.1 STILL
# declares rusqlite ^0.37.0, so this is chained to a burn-dataset release that
# has not happened — NOT to burn 0.22, which is a different and commonly
# repeated mistake.
#
# Our usage is Connection::open + params! + query (storage.rs, 15 call sites),
# stable across all these versions, so the day the pin lifts the move is free.
rusqlite = { version = "0.37.0", features = ["bundled", "chrono"] }
chrono = { version = "0.4.44", features = ["serde"] }
uuid = { version = "1.19.0", features = ["v4", "serde"] }
ndarray = "0.17.2"
# reqwest >= 0.13.3 logs only the host, not the full URL — protects client_secret from leaking to debug/trace logs.
# In 0.13, `form`/`query` are opt-in features (per the 0.13.0 CHANGELOG).
reqwest = { version = "0.13.3", default-features = true, features = ["rustls", "json", "blocking", "query", "form"] }
# API key wrapped in `secrecy::SecretString` (a `Box<str>` that cannot
# reallocate, zeroized on drop). The zeroize upstream docs explicitly point
# users to `secrecy` for string-shaped secrets because `Zeroizing<String>`
# leaves un-zeroed reallocated buffers on the heap.
secrecy = "0.10"
# TOML serializer for the broker credentials file. Owns the
# canonical on-disk shape so both neoethos-app and neoethos-cli can
# read + write `broker_credentials.toml` without a workspace cycle.
toml = "0.8.20"
wgpu = { version = "29.0.3", optional = true }
pollster = { version = "0.4.0", optional = true }

[target.'cfg(windows)'.dependencies]
# F-101 follow-up (2026-05-25 — corrected after verbose build):
# pruned from the previous 4-feature set down to the 3 actually
# used after `utils/window_control.rs` was deleted:
#   - `Win32_System_Console` — CLI console-mode detection
#   - `Win32_UI_WindowsAndMessaging` — the startup MessageBox dialog
#     in `logging.rs:140` (no-tty fallback)
#   - `Win32_Foundation` — required by the WindowsAndMessaging types
# `Win32_UI_Input_KeyboardAndMouse` was the only feature truly orphaned
# by the F-101 deletion.
# Keep this exact pin aligned with wgpu-hal 29.0.3's gpu-allocator 0.28.0.
# gpu-allocator's Windows constraint ends at 0.62.0; allowing Cargo to select
# 0.62.1+ gives wgpu-hal two incompatible WinRT/D3D12 type families.
windows = { version = "=0.62.0", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_UI_WindowsAndMessaging",
] }
