# cubecl runtime configuration — discovered by cubecl's
# `RuntimeConfig::from_current_dir()`, which walks UP from the process CWD,
# so any CLI/engine run from (or under) the repo root picks this up.
#
# ── WHY `[streaming] max_streams = 1` IS GONE (2026-08-02) ──────────────────
#
# It used to pin `max_streams = 1`. That was a workaround for burn #4792:
# cubecl-cuda assigns ONE CUDA stream per touching thread and, by default,
# allows up to 128, so with ~N rayon workers driving the GPU each thread got
# its OWN grow-only VRAM pool and the total was N x the per-pool budget —
# which is what filled a 48 GB A6000 on M1. Collapsing to a single stream made
# the per-pool budget bound the WHOLE process.
#
# It is removed on the operator's explicit instruction, together with enabling
# `burn-cuda-backend`. Two things must be said plainly about that:
#
# 1. Until now the pin was A NO-OP FOR DISCOVERY. The discovery kernels live
#    in `neoethos-gpu-cuda`, which has no cubecl dependency at all — it is
#    cc-compiled .cu on the raw driver API. Nothing in the shipped discovery
#    path read this file. Removing it therefore cannot change discovery.
#
# 2. It becomes LOAD-BEARING the moment burn trains on the card, because
#    burn-cuda does go through cubecl-cuda's stream pools. And the real fix
#    for #4792 is NOT in the version we are on: burn #4991 closed 2026-07-31,
#    two days AFTER the 0.22.0-pre.1 cut of 2026-07-29. So removing the pin
#    may reintroduce the multi-pool VRAM leak on any run that puts burn
#    training on the GPU (i.e. a `gpu-cuda` build whose burn device policy is
#    `gpu`, not the shipped default).
#
# THE MEASUREMENT THAT WOULD DETECT IT: peak VRAM across a FULL training run,
# not a spot reading. Sample
#   nvidia-smi --query-gpu=memory.used --format=csv,noheader -l 1
# for the whole duration of a multi-model, multi-combo training pass with the
# burn device policy set to `gpu`, and take the MAXIMUM. The leak signature is
# monotonic growth roughly proportional to the number of rayon worker threads
# that ever touched the GPU, ending in an OOM on a card with ample headroom
# for any single model. A single end-of-run reading will NOT show it — the
# pools are freed at process exit.
#
# If that measurement shows the leak, the pin goes back (and the file must
# stay VALID TOML — cubecl PANICS at startup on a malformed config rather
# than ignoring it) until a burn release containing #4991 lands.
#
# SCOPE: this file only affects builds that link cubecl (burn-cuda /
# burn-wgpu / the cubecl_eval lane). The Vulkan/wgpu path additionally bounds
# its pool in-code (`create_gpu_client` in cubecl_eval.rs installs a graduated
# pool with a finite `dealloc_period`); CPU builds never read this file.
