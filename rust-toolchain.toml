# Pinned to the nightly the operator builds with locally (rustc 1.96.0-nightly
# 2026-04-07). The operator requires Rust nightly; pinning a fixed date keeps
# the toolchain identical everywhere — local Windows/WSL2, GPU VPS, and CI —
# so builds remain reproducible instead of drifting with the nightly channel.
[toolchain]
channel = "nightly-2026-04-07"
