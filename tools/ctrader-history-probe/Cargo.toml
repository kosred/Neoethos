[package]
name = "ctrader-history-probe"
version = "0.0.0"
edition = "2024"
publish = false

# This diagnostic compiles the real cTrader transport/history/auth modules
# without pulling neoethos-app's models, search UI, or Tauri graph.
[workspace]

[dependencies]
anyhow = "1.0"
base64 = "0.22"
hickory-resolver = "0.26.1"
keyring = { version = "3.6.3", default-features = true, features = ["windows-native"] }
neoethos-core = { path = "../../crates/neoethos-core" }
open = "5.3.2"
rand = "0.9.2"
reqwest = { version = "0.13.3", default-features = true, features = ["blocking", "json", "rustls", "query", "form"] }
rustls = { version = "0.23.37", features = ["ring"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_repr = "0.1"
tokio = { version = "1.49.0", features = ["net", "rt", "time"] }
tracing = "0.1"
tungstenite = { version = "0.28.0", features = ["rustls-tls-native-roots"] }
