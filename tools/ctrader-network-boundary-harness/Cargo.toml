[package]
name = "ctrader-network-boundary-harness"
version = "0.0.0"
edition = "2024"
publish = false

# src/app_services/mod.rs path-compiles the real DNS/TCP/TLS/WebSocket modules;
# cargo-machete does not traverse those source paths outside this leaf crate.
[package.metadata.cargo-machete]
ignored = [
    "hickory-resolver",
    "neoethos-core",
    "serde",
    "serde_json",
    "tokio",
    "tracing",
]

# Keep this leaf harness outside the repository workspace graph. Its purpose is
# to compile the real cTrader transport modules without pulling neoethos-models.
[workspace]

[dependencies]
anyhow = "1.0"
hickory-resolver = "0.26.1"
neoethos-core = { path = "../../crates/neoethos-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.49.0", features = ["net", "rt", "time"] }
tracing = "0.1"
tungstenite = { version = "0.28.0", features = ["rustls-tls-native-roots"] }
